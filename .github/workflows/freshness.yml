# Is the live verifier what main says it should be? Compares the page's
# build stamp with the stamp computed from this checkout and the registry's
# latest version. Runs daily and by hand. Its badge is on the README, so a
# stale page is visible on the repository's front page, not only by email.
name: freshness
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/live-check.mjs
