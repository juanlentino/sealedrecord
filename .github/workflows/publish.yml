name: publish
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write   # trusted publishing: npm trusts this workflow's OIDC token, no secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} but package.json is $v"; exit 1; }
      - run: npm publish --access public

  # The verifier page is rebuilt only when a version is published, from that
  # version's tarball, and only if the tarball matches the tag byte for byte.
  pages:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build stamp needs history
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: wait for the registry to serve this version
        run: |
          v=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            npm view "sealedrecord@$v" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "sealedrecord@$v not on the registry after 5 minutes"; exit 1
      - run: node scripts/site-assemble.mjs
      - name: the published tarball must match the tag
        run: |
          diff dist-site/sealedrecord/index.js index.js
          diff -r dist-site/sealedrecord/src src
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: what is live must be what was just built (Pages caches for ten minutes; keep asking)
        run: |
          for i in $(seq 1 40); do node scripts/live-check.mjs && exit 0; sleep 20; done
          echo "the live page never matched this build"; exit 1

  # The GitHub Release carries every deliverable as its own file: the npm
  # tarball exactly as the registry serves it, the web verifier as a zip
  # that works offline, the conformance vectors, and the two documents.
  release:
    needs: [publish, pages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: assemble the assets
        run: |
          v=$(node -p "require('./package.json').version")
          mkdir -p assets
          npm pack "sealedrecord@$v" --pack-destination assets --silent
          node scripts/site-assemble.mjs
          (cd dist-site && zip -qr "../assets/verifier-$v.zip" .)
          (cd vectors && zip -qr "../assets/vectors-$v.zip" .)
          cp docs/FORMAT.md COMPARISON.md assets/
          node scripts/release-notes.mjs "$v" > notes.md
          ls -l assets
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file notes.md assets/*
